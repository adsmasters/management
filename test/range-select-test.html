<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Test: Bereichsauswahl MA-Umsatz</title>
  <style>
    :root { --border:#e5e7eb; --text:#111827; --text-secondary:#6b7280; --surface:#fff; --radius:8px; }
    body { font-family:-apple-system,sans-serif; margin:20px; }
    table.matrix { width:100%; border-collapse:collapse; font-size:13px; }
    table.matrix th, table.matrix td { padding:8px 10px; white-space:nowrap; }
    table.matrix td.right, table.matrix th.right { text-align:right; font-variant-numeric:tabular-nums; }
    table.matrix tbody tr { border-bottom:1px solid var(--border); }
    table.matrix td.emp { font-weight:600; }
    table.matrix tbody tr.emp-row:hover td { background:#f5f3ff; }
    table.matrix tbody td.rsel { background:#c7d2fe !important; box-shadow:inset 0 0 0 1px #6366f1; }
    .sel-pill { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:95;
      background:#111827; color:#fff; padding:9px 16px; border-radius:999px; font-size:13px;
      box-shadow:0 8px 24px rgba(0,0,0,.25); white-space:nowrap; }
    .sel-pill b { font-weight:700; }
    .hidden { display:none; }
    .modal-ov { display:none; } .modal-ov.open { display:flex; }
  </style>
</head>
<body>
<h3>Testseite: Bereichsauswahl (echtes js/employee-revenue.js, gestubbte Abhängigkeiten)</h3>
<div id="error"></div>
<select id="yearSelect"></select>
<select id="metricSelect"><option value="revenue">Umsatz / MA</option><option value="hours">Stunden</option></select>
<button id="loadBtn">Laden</button>
<div id="loading" class="hidden"></div>
<div id="content">
  <table class="matrix"><thead><tr id="gridHead"></tr></thead><tbody id="gridBody"></tbody></table>
  <div id="unattributedWrap"></div>
  <div id="scenarioWrap"></div>
</div>
<div class="modal-ov" id="empModal"><div>
  <h3 id="empModalTitle"></h3><div id="empModalSub"></div>
  <button id="empModalClose">×</button>
  <select id="empModalMonth"></select>
  <div id="empModalBody"></div>
</div></div>

<script>
  // Stubs statt db.js/utils.js/auth.js — nur was der IIFE-Init braucht
  window.currentYearMonth = function () { return { year: 2026, month: 7 }; };
  window.getRoleShort = function (r) { return r; };
  window.db = {};
</script>
<script src="../js/employee-revenue.js"></script>
<script>
  // Fake-Zeile im selben Format wie render() sie erzeugt
  var M = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  var head = '<th>Mitarbeiter</th>';
  for (var m = 1; m <= 12; m++) head += '<th class="right">' + M[m-1] + '</th>';
  document.getElementById('gridHead').innerHTML = head + '<th class="right">Σ Jahr</th>';
  function row(name, base) {
    var cells = '', sum = 0;
    for (var m = 1; m <= 12; m++) { var v = base * m; sum += v;
      cells += '<td class="right" data-m="' + m + '" data-v="' + v + '">' + v.toLocaleString('de-DE') + ' €</td>'; }
    return '<tr class="emp-row" data-emp="' + name + '"><td class="emp">' + name + ' <span class="role">ADV</span></td>' + cells + '<td class="right">' + sum.toLocaleString('de-DE') + ' €</td></tr>';
  }
  document.getElementById('gridBody').innerHTML = row('Testperson', 1000) + row('Zweite', 500);
</script>
</body>
</html>
