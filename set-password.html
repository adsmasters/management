<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neues Passwort setzen – Management</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">Adsmasters <span>Management</span></div>
    <p class="login-subtitle">Neues Passwort setzen</p>

    <div id="msg" class="alert alert-danger hidden" style="margin-bottom:18px"></div>

    <div id="formArea" class="hidden">
      <div class="field" style="margin-bottom:14px">
        <label for="pw1">Neues Passwort</label>
        <input type="password" id="pw1" autocomplete="new-password" placeholder="Mindestens 8 Zeichen">
      </div>
      <div class="field" style="margin-bottom:22px">
        <label for="pw2">Passwort wiederholen</label>
        <input type="password" id="pw2" autocomplete="new-password">
      </div>
      <button id="saveBtn" class="btn btn-primary" style="width:100%;justify-content:center;padding:10px">
        Passwort speichern
      </button>
    </div>

    <p id="status" style="margin-top:6px;text-align:center;font-size:13px;color:var(--text-muted)">
      Link wird geprüft …
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/db.js"></script>
<script src="js/set-password.js"></script>
  <script defer src="https://adsmasters.github.io/hub/backlink.js"></script>
</body>
</html>
